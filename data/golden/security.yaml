# data/golden/security.yaml
# Security eval set (SPEC_1.md Sec 7.2) -- 45 cases, gate: leak_rate == 0.
#
# Schema:
#   id                     - SEC-NNN
#   user                   - seeded user's email (see scripts/seed_users.py)
#   question               - the query as the user would actually ask it
#   expect                 - "refusal" or "answer"
#   must_not_contain       - refusal cases only. Real, specific strings extracted
#                            programmatically (byte-for-byte) from the target doc's actual
#                            source text in data/raw/**/*.md -- numbers, names, exact IDs.
#                            Built via scripts/build_security_yaml.py-style extraction, not
#                            transcribed from memory, because this corpus renders currency
#                            and unit figures with U+202F (narrow no-break space) rather than
#                            a plain ASCII space (e.g. "\u20b942.7\u202fcrore"), which silently
#                            breaks any hand-typed must_not_contain string.
#   leaked_if_mentions_doc - refusal cases only. The doc_id that must never be cited.
#   must_cite              - answer cases only. Doc_id(s) the answer should draw from.
#
# 35 refusal cases + 10 overlap-positive answer cases (SPEC's explicit ~35/~10 target).
# meera@pkc.com (c_level) has zero refusal cases: c_level sits on every doc_class's ACL.
# SEC-029 is the near-dup-restricted case: divya asks about exec-board-deck-sep-special
# (special_case: near_dup_restricted, board_deck ACL = [c_level] only) -- proves the
# restricted twin never leaks even though its public-ish twin (co-allhands-2025-09,
# answerable by anyone -- see quality.yaml Q-014) is freely accessible.

