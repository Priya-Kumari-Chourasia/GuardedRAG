# data/golden/quality.yaml
# Quality eval set (SPEC_1.md Sec 7.1) -- 80 per-role Q&A pairs against the real corpus.
#
# Schema:
#   id           - Q-NNN
#   user         - seeded user's email; this IS their role (see scripts/seed_users.py) --
#                  the harness looks up roles from this, never hardcode a role field here
#   question     - natural question the user would actually ask
#   ground_truth - reference answer, factually grounded in the cited doc(s). Used by Ragas
#                  context_recall/answer comparison.
#   must_cite    - list of doc_ids the answer should draw from (grounding/precision check)
#   category     - "standard" | "cross_ref" | "conflicting_versions" | "near_dup" | "multi_doc"
#
# Every fact below is taken from the actual corpus text in data/raw/**/*.md -- none invented.
# Overlap-role coverage: cloud_costs asked by both finance_analyst (arjun) and
# engineering_lead (karan); marketing_spend asked by both finance_analyst (arjun) and
# sales_lead (divya) -- proves precise, non-hierarchical authorization on the quality side,
# mirroring security.yaml's overlap positives.

